<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12141C" />
    <title>Who Did It mockup: HUD over the world</title>
    <!-- Static mockup built from the theme only; served by the dev server (src/ui/theme/README.md). -->
    <link rel="stylesheet" href="/Who-Did-It/src/ui/theme/tokens.css" />
    <link rel="stylesheet" href="/Who-Did-It/src/ui/theme/components.css" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--wdi-space-4);
      }
      .world {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 62% 58%, rgb(var(--wdi-lantern-rgb) / 0.22), transparent 26%),
          radial-gradient(circle at 20% 15%, rgb(var(--wdi-moon-rgb) / 0.16), transparent 40%),
          repeating-linear-gradient(90deg, transparent 0 63px, rgb(var(--wdi-slate-rgb) / 0.5) 63px 64px),
          repeating-linear-gradient(0deg, transparent 0 63px, rgb(var(--wdi-slate-rgb) / 0.5) 63px 64px),
          var(--wdi-slate);
      }
      .world::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgb(var(--wdi-ink-rgb) / 0.55);
      }
      .house {
        position: absolute;
        background: var(--wdi-ink);
        border: var(--wdi-stroke-w) solid var(--wdi-ink);
        box-shadow: inset 0 0 0 2px var(--wdi-fog);
      }
      .fog {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 110%, rgb(var(--wdi-fog-rgb) / 0.35), transparent 60%),
          radial-gradient(ellipse at 10% 0%, rgb(var(--wdi-moon-rgb) / 0.18), transparent 50%), var(--wdi-ink);
      }
      .wdi-edge-cue {
        top: 40%;
        right: 0;
        animation: none;
      }
      .wdi-toasts {
        animation: none;
      }
    </style>
  </head>
  <body class="wdi-root">
    <div class="world">
      <div class="house" style="left: 8%; top: 30%; width: 22%; height: 26%"></div>
      <div class="house" style="left: 48%; top: 10%; width: 18%; height: 22%"></div>
      <div class="house" style="left: 70%; top: 55%; width: 20%; height: 30%"></div>
    </div>
    <div class="wdi-hud">
      <div class="wdi-hud__tl">
        <button class="wdi-hud-chip">
          <span class="wdi-icon-disc"
            ><img class="wdi-icon" src="/Who-Did-It/assets/ui/marks/mark_notebook_tab.svg" alt="" /></span
          ><span class="wdi-hud-chip__text"
            ><span class="wdi-hud-chip__role">Your goal</span
            ><span class="wdi-hud-chip__goal">Find every Cabal member before they find you.</span></span
          >
        </button>
      </div>
      <div class="wdi-hud__tc">
        <div class="wdi-hud-clock wdi-hud-clock--night">
          <span class="wdi-hud-clock__phase">Night 1</span>0:48
        </div>
      </div>
      <div class="wdi-hud__tr">
        <div class="wdi-log">
          <p class="wdi-log__line">A scream from the north</p>
          <p class="wdi-log__line">Wren entered The Drowned Lantern</p>
        </div>
      </div>
      <div class="wdi-edge-cue" aria-label="A scream, north">
        <img
          class="wdi-icon"
          src="/Who-Did-It/assets/ui/glyphs/glyph_chevron.svg"
          alt=""
          style="transform: rotate(180deg)"
        />
      </div>
      <div class="wdi-hud__bl">
        <div class="wdi-stick" aria-label="Move"><div class="wdi-stick__knob"></div></div>
      </div>
      <div class="wdi-hud__br">
        <div class="wdi-touch-cluster">
          <button class="wdi-touch-btn"><span class="wdi-touch-btn__key">B</span>bell</button>
          <button class="wdi-touch-btn wdi-touch-btn--primary">
            <span class="wdi-touch-btn__key">E</span>use
          </button>
          <button class="wdi-touch-btn"><span class="wdi-touch-btn__key">Shift</span>sneak</button>
          <button class="wdi-touch-btn"><span class="wdi-touch-btn__key">Tab</span>card</button>
        </div>
      </div>
      <div class="wdi-toasts">
        <div class="wdi-toast wdi-toast--interact" role="status">
          <span class="wdi-icon-disc"
            ><img class="wdi-icon" src="/Who-Did-It/assets/ui/glyphs/glyph_hand.svg" alt="" /></span
          >Hold E on a glowing clue<kbd class="wdi-kbd wdi-toast__kbd">E</kbd>
        </div>
      </div>
    </div>
  </body>
</html>
