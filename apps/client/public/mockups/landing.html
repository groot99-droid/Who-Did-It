<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12141C" />
    <title>Who Did It mockup: Landing</title>
    <!-- Static mockup built from the theme only; served by the dev server (src/ui/theme/README.md). -->
    <link rel="stylesheet" href="/Who-Did-It/src/ui/theme/tokens.css" />
    <link rel="stylesheet" href="/Who-Did-It/src/ui/theme/components.css" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--wdi-space-4);
      }
      .world {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 62% 58%, rgb(var(--wdi-lantern-rgb) / 0.22), transparent 26%),
          radial-gradient(circle at 20% 15%, rgb(var(--wdi-moon-rgb) / 0.16), transparent 40%),
          repeating-linear-gradient(90deg, transparent 0 63px, rgb(var(--wdi-slate-rgb) / 0.5) 63px 64px),
          repeating-linear-gradient(0deg, transparent 0 63px, rgb(var(--wdi-slate-rgb) / 0.5) 63px 64px),
          var(--wdi-slate);
      }
      .world::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgb(var(--wdi-ink-rgb) / 0.55);
      }
      .house {
        position: absolute;
        background: var(--wdi-ink);
        border: var(--wdi-stroke-w) solid var(--wdi-ink);
        box-shadow: inset 0 0 0 2px var(--wdi-fog);
      }
      .fog {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 110%, rgb(var(--wdi-fog-rgb) / 0.35), transparent 60%),
          radial-gradient(ellipse at 10% 0%, rgb(var(--wdi-moon-rgb) / 0.18), transparent 50%), var(--wdi-ink);
      }
    </style>
  </head>
  <body class="wdi-root">
    <div class="fog"></div>
    <div id="overlay">
      <section class="wdi-panel wdi-stack" aria-labelledby="t">
        <p class="wdi-eyebrow">Hollowmere, after dark</p>
        <h1 class="wdi-display wdi-display--xl" id="t">Who Did It</h1>
        <p class="wdi-muted">
          A hidden-role mystery for 4 to 10 friends. Open the link, pick a name, gather your party.
        </p>
        <div class="wdi-field">
          <label class="wdi-label" for="name">Your name</label>
          <input class="wdi-input" id="name" value="Tamsin" autocomplete="nickname" />
          <p class="wdi-field__msg">2 to 16 characters</p>
        </div>
        <button class="wdi-btn wdi-btn--primary wdi-btn--lg wdi-btn--block">Create party</button>
        <div class="wdi-divider">or join a friend</div>
        <div class="wdi-row">
          <input class="wdi-input wdi-input--code" value="K7PQX" aria-label="Party code" />
          <button class="wdi-btn wdi-grow">Join party</button>
        </div>
        <p class="wdi-field__msg" role="alert"></p>
      </section>
    </div>
  </body>
</html>
