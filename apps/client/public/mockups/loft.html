<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12141C" />
    <title>Who Did It mockup: The dark loft</title>
    <!-- Static mockup built from the theme only; served by the dev server (src/ui/theme/README.md). -->
    <link rel="stylesheet" href="/Who-Did-It/src/ui/theme/tokens.css" />
    <link rel="stylesheet" href="/Who-Did-It/src/ui/theme/components.css" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--wdi-space-4);
      }
      .world {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 62% 58%, rgb(var(--wdi-lantern-rgb) / 0.22), transparent 26%),
          radial-gradient(circle at 20% 15%, rgb(var(--wdi-moon-rgb) / 0.16), transparent 40%),
          repeating-linear-gradient(90deg, transparent 0 63px, rgb(var(--wdi-slate-rgb) / 0.5) 63px 64px),
          repeating-linear-gradient(0deg, transparent 0 63px, rgb(var(--wdi-slate-rgb) / 0.5) 63px 64px),
          var(--wdi-slate);
      }
      .world::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgb(var(--wdi-ink-rgb) / 0.55);
      }
      .house {
        position: absolute;
        background: var(--wdi-ink);
        border: var(--wdi-stroke-w) solid var(--wdi-ink);
        box-shadow: inset 0 0 0 2px var(--wdi-fog);
      }
      .fog {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 110%, rgb(var(--wdi-fog-rgb) / 0.35), transparent 60%),
          radial-gradient(ellipse at 10% 0%, rgb(var(--wdi-moon-rgb) / 0.18), transparent 50%), var(--wdi-ink);
      }
      .wdi-edge-cue {
        top: 50%;
        left: var(--wdi-space-4);
        animation: none;
      }
    </style>
  </head>
  <body class="wdi-root">
    <div class="wdi-loft">
      <p class="wdi-eyebrow">Crumb's Ovens, the loft</p>
      <h1 class="wdi-display wdi-display--lg" style="color: var(--wdi-text)">The village sleeps</h1>
      <p class="wdi-text" style="max-width: 36ch; text-align: center">
        You lie still in your bedroll. Somewhere below, something creaks.
      </p>
      <ul class="wdi-bedrolls">
        <li class="wdi-bedroll is-self">
          <span class="wdi-bedroll__blanket" aria-hidden="true"></span>Tamsin
        </li>
        <li class="wdi-bedroll"><span class="wdi-bedroll__blanket" aria-hidden="true"></span>Marlow</li>
        <li class="wdi-bedroll"><span class="wdi-bedroll__blanket" aria-hidden="true"></span>Osric</li>
        <li class="wdi-bedroll"><span class="wdi-bedroll__blanket" aria-hidden="true"></span>Pell</li>
        <li class="wdi-bedroll"><span class="wdi-bedroll__blanket" aria-hidden="true"></span>Wren</li>
        <li class="wdi-bedroll"><span class="wdi-bedroll__blanket" aria-hidden="true"></span>Hob</li>
        <li class="wdi-bedroll"><span class="wdi-bedroll__blanket" aria-hidden="true"></span>Ida</li>
        <li class="wdi-bedroll"><span class="wdi-bedroll__blanket" aria-hidden="true"></span>Garth</li>
      </ul>
      <p class="wdi-hint">No clock. No moving. What you hold at dawn is what you are.</p>
      <div class="wdi-edge-cue wdi-edge-cue--cool" aria-label="A creak from the west">
        <img
          class="wdi-icon"
          src="/Who-Did-It/assets/ui/glyphs/glyph_chevron.svg"
          alt=""
          style="transform: rotate(90deg)"
        />
      </div>
    </div>
  </body>
</html>
