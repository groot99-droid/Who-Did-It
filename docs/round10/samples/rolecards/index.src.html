<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Role Cards Mock</title>
<meta name="description" content="Who Did It, round 10 (10R): the trifold role card and the Daybook, a clickable mock filled from packages/content." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ---- Proposed tokens (docs/round10/rolecards.md 6). Reused game tokens keep their hex: ink, bone, slate, mustard,
   moon, blood. The rest is the proposed `dossier` set, DOM only, like round 7's night set. ---- */
:root {
  --wdi-ink: #12141c; --wdi-bone: #d9d2c2; --wdi-slate: #2c3240; --wdi-mustard: #f2b33d;
  --wdi-moon: #7fa8ff; --wdi-blood: #b3121f; --wdi-night: #0a0924; --wdi-lantern: #ffb457; --wdi-teal: #2ec4b6;
  --d-paper: #eceef2; --d-card: #fbfbfc; --d-ink: var(--wdi-ink); --d-soft: #586072; --d-rule: #d3d8e0;
  --d-well: #f1ebdd; --d-mustard-text: #8c600a; --d-mustard: var(--wdi-mustard); --d-on-mustard: var(--wdi-ink);
  --d-moss: #2f6b45; --d-brick: #9e3b2a; --d-focus: #2d5fa8; --d-sheet: var(--wdi-slate); --d-line: var(--wdi-ink);
  --f-display: 'Alegreya SC', Georgia, serif; --f-text: 'Alegreya Sans', system-ui, sans-serif;
  --f-label: 'IBM Plex Mono', ui-monospace, monospace;
  --dur: 220ms; --dur-fold: 520ms; --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --d-paper: #2a303d; --d-card: #343b4a; --d-ink: var(--wdi-bone); --d-soft: #a9afbc; --d-rule: #4a5264;
  --d-well: #3d4352; --d-mustard-text: var(--wdi-mustard); --d-moss: #8fcba2; --d-brick: #ec917a;
  --d-focus: var(--wdi-moon); --d-line: var(--wdi-bone);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur: 0ms; --dur-fold: 0ms; } }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: var(--wdi-night); color: var(--d-ink); font: 400 17px/1.5 var(--f-text); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--d-focus); outline-offset: 2px; }
.mono { font-family: var(--f-label); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.num { font-family: var(--f-label); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---- the mock's own controls (not part of the design) ---- */
.mockbar { flex: none; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 8px 16px; background: var(--d-card); border-bottom: 2px solid var(--d-line); font-size: 15px; }
.mockbar h1 { margin: 0 8px 0 0; font: 700 20px/1.1 var(--f-display); }
.mockbar label { display: inline-flex; gap: 6px; align-items: center; }
.mockbar select, .mockbar button { min-height: 36px; border: 1px solid var(--d-rule); border-radius: 6px; background: var(--d-paper); color: var(--d-ink); padding: 0 10px; }
.mockbar .note { color: var(--d-soft); font-size: 14px; margin-left: auto; }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.stage[data-view='phone'] { display: grid; place-items: center; padding: 16px; }

/* ---- the world behind (a stand-in: night ground and a few tiles) ---- */
.world { position: absolute; inset: 0; background:
  radial-gradient(ellipse at 40% 55%, rgb(255 180 87 / 0.18), transparent 45%),
  repeating-linear-gradient(30deg, rgb(127 168 255 / 0.05) 0 2px, transparent 2px 46px),
  repeating-linear-gradient(-30deg, rgb(127 168 255 / 0.05) 0 2px, transparent 2px 46px),
  linear-gradient(#141a2e, #0a0924); }
.phone { position: relative; width: 390px; height: min(844px, 100%); max-width: 100%; border-radius: 36px; overflow: hidden;
  border: 10px solid #000; box-shadow: 0 30px 80px rgb(0 0 0 / 0.5); container-type: inline-size; }
.desk { position: absolute; inset: 0; container-type: inline-size; }

/* ---- the HUD that stays (doc 5.2) ---- */
.hud { position: absolute; inset: 0; pointer-events: none; color: var(--wdi-bone); font-size: 14px; }
.hud > * { pointer-events: auto; }
.hud-goal { position: absolute; left: 12px; top: 12px; display: flex; gap: 8px; align-items: center; max-width: min(360px, 60%);
  padding: 6px 12px 6px 6px; border-radius: 999px; background: rgb(18 20 28 / 0.78); border: 1px solid rgb(217 210 194 / 0.3); cursor: pointer; text-align: left; }
.hud-goal .disc { color: var(--wdi-ink); width: 32px; height: 32px; border-radius: 50%; background: var(--wdi-bone); display: grid; place-items: center; flex: none; }
.hud-goal b { display: block; font: 700 15px/1.1 var(--f-display); }
.hud-goal span { display: block; font-size: 13px; line-height: 1.25; color: rgb(217 210 194 / 0.85); }
.hud-clock { position: absolute; left: 50%; top: 12px; translate: -50% 0; padding: 4px 14px; border-radius: 999px; background: rgb(18 20 28 / 0.8); text-align: center; }
.hud-clock .num { font-size: 20px; color: var(--wdi-lantern); }
.hud-tr { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; }
.hud-btn { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid rgb(217 210 194 / 0.35); background: rgb(18 20 28 / 0.8); color: var(--wdi-bone); display: inline-flex; gap: 6px; align-items: center; justify-content: center; padding: 0 10px; cursor: pointer; }
.hud-btn kbd, .kbd { font-family: var(--f-label); font-size: 12px; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; min-width: 20px; display: inline-block; text-align: center; line-height: 18px; }
.hud-btn .badge { width: 8px; height: 8px; border-radius: 50%; background: var(--wdi-mustard); }
.hud-body { position: absolute; left: 12px; bottom: 96px; width: 200px; }
.bar { height: 8px; border-radius: 4px; background: rgb(217 210 194 / 0.2); overflow: hidden; margin: 4px 0; }
.bar i { display: block; height: 100%; }
.hud-purse { position: absolute; right: 12px; bottom: 96px; padding: 4px 12px; border-radius: 999px; background: rgb(18 20 28 / 0.8); }
.hotbar { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; display: flex; gap: 6px; }
.hotbar button { width: 52px; height: 52px; border-radius: 8px; background: rgb(18 20 28 / 0.75); border: 1px solid rgb(217 210 194 / 0.3); color: var(--wdi-bone); font-size: 11px; line-height: 1.1; padding: 2px; position: relative; }
.hotbar button.on { border: 2px solid var(--wdi-mustard); }
.hotbar button .n { position: absolute; left: 4px; top: 2px; font-family: var(--f-label); font-size: 11px; opacity: 0.8; }
.touch { position: absolute; inset: auto 0 0 0; height: 0; }
.stick { position: absolute; left: 20px; bottom: 120px; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgb(217 210 194 / 0.4); background: rgb(18 20 28 / 0.4); }
.stick::after { content: ''; position: absolute; inset: 34px; border-radius: 50%; background: var(--wdi-bone); }
.stick small { position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; color: rgb(217 210 194 / 0.85); font-size: 12px; }
.sneak-toggle { position: absolute; left: 148px; bottom: 124px; }
.cluster { position: absolute; right: 16px; bottom: 112px; display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; direction: rtl; }
.disc { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--wdi-ink); background: var(--wdi-bone); color: var(--wdi-ink); display: grid; place-content: center; text-align: center; font-size: 11px; line-height: 1.1; direction: ltr; }
.disc b { font: 700 16px/1 var(--f-label); }
.disc.primary { background: var(--wdi-mustard); width: 72px; height: 72px; }
.desk .touch, .desk .sneak-toggle { display: none; }
.phone .hud-body, .phone .hud-purse { bottom: 248px; }
.phone .hud-body { width: 150px; }
.phone .hotbar { bottom: 78px; }
.phone .hotbar button { width: 44px; height: 44px; font-size: 9px; }
.phone .hud-goal { max-width: 230px; }
.phone .hud-goal span { display: none; }

/* ---- the trifold (doc 2) ---- */
.scrim { position: absolute; inset: 0; background: rgb(10 9 36 / 0.55); z-index: 10; }
.card { position: absolute; z-index: 11; inset: 16px; display: flex; flex-direction: column; background: var(--d-paper);
  border: 2px solid var(--d-line); border-radius: 8px; box-shadow: 0 24px 60px rgb(0 0 0 / 0.45); overflow: hidden; }
.card::before { content: ''; position: absolute; inset: 5px; border: 2px solid var(--fac); border-radius: 4px; pointer-events: none; z-index: 2; }
.card[data-faction='village'] { --fac: var(--wdi-moon); --on-fac: var(--wdi-ink); }
.card[data-faction='cabal'] { --fac: var(--wdi-blood); --on-fac: var(--wdi-bone); }
.card[data-faction='neutral'] { --fac: var(--wdi-mustard); --on-fac: var(--wdi-ink); }
.motif { position: absolute; width: 26px; height: 26px; z-index: 3; color: var(--d-line); pointer-events: none; }
.motif.tl { left: 9px; top: 9px; } .motif.tr { right: 9px; top: 9px; transform: scaleX(-1); }
.motif.bl { left: 9px; bottom: 9px; transform: scaleY(-1); } .motif.br { right: 9px; bottom: 9px; transform: scale(-1, -1); }
.topbar { position: relative; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 14px 20px 12px 44px; background: var(--d-card); border-bottom: 2px solid var(--d-line); }
.stripe { display: inline-flex; gap: 8px; align-items: center; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--fac); color: var(--on-fac); font-weight: 700; }
.stripe .glyph { width: 26px; height: 26px; border-radius: 50%; background: var(--wdi-bone); color: var(--wdi-ink); display: grid; place-items: center; }
.topbar .title { font: 700 26px/1 var(--f-display); margin: 0; }
.topbar .spacer { flex: 1; }
.meter { position: absolute; left: 0; right: 0; bottom: -2px; height: 4px; background: transparent; }
.meter i { display: block; height: 100%; background: var(--d-mustard); transform-origin: left; }
.meter i.run { animation: drain var(--hold) linear forwards; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.btn { min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--d-line); background: var(--d-card); color: var(--d-ink); font-weight: 700; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.btn.primary { background: var(--d-mustard); color: var(--d-on-mustard); border-color: var(--d-on-mustard); }
.btn.sm { min-height: 36px; padding: 0 10px; font-weight: 500; }
.secs { font-family: var(--f-label); font-size: 13px; color: var(--d-soft); }
.panels { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.1fr 1.15fr; perspective: 2200px; }
.panel { min-height: 0; overflow: auto; padding: 22px 26px 32px; background: var(--d-paper); position: relative; scrollbar-width: thin; }
.panel + .panel { border-left: 1px dashed var(--d-rule); box-shadow: inset 14px 0 18px -16px rgb(0 0 0 / 0.25); }
.panel:nth-child(1) { transform-origin: right center; } .panel:nth-child(3) { transform-origin: left center; }
.card.folded .panel:nth-child(1) { transform: rotateY(-178deg); } .card.folded .panel:nth-child(3) { transform: rotateY(178deg); }
.card .panel:nth-child(1), .card .panel:nth-child(3) { transition: transform var(--dur-fold) var(--ease); backface-visibility: hidden; }
.eyebrow { margin: 0 0 4px; color: var(--d-soft); }
h2.sec { font: 700 22px/1.15 var(--f-display); margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--d-line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2.sec:first-child { margin-top: 0; }
h3.sub { font: 700 15px/1.2 var(--f-label); text-transform: uppercase; letter-spacing: 0.08em; color: var(--d-soft); margin: 18px 0 8px; }
.box { background: var(--d-card); border: 1px solid var(--d-rule); border-radius: 8px; padding: 12px 14px; }
.box + .box { margin-top: 10px; }
.well { background: var(--d-well); border-radius: 8px; padding: 10px 14px; margin: 12px 0; }
.well .mono { color: var(--d-mustard-text); display: block; margin-bottom: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-label); font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--d-ink); color: var(--d-card); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-label); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.moss { color: var(--d-moss); } .pill.brick { color: var(--d-brick); } .pill.mustard { color: var(--d-mustard-text); } .pill.soft { color: var(--d-soft); }
.portrait { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: start; }
.portrait .pic { aspect-ratio: 2 / 3; border-radius: 6px; background: var(--d-sheet); color: var(--wdi-bone); display: grid; place-items: center; border: 2px solid var(--d-line); font: 700 40px/1 var(--f-display); position: relative; overflow: hidden; }
.portrait .pic small { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font: 400 10px/1 var(--f-label); opacity: 0.8; }
.traits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.trait { display: inline-flex; gap: 6px; align-items: center; padding: 2px 10px 2px 6px; border-radius: 999px; background: var(--d-card); border: 1px solid var(--d-rule); font-size: 15px; }
.lore { font-size: 18px; line-height: 1.45; font-style: italic; margin: 14px 0 0; }
.deck { display: flex; flex-wrap: wrap; gap: 6px; }
.deck .pill { color: var(--d-ink); }
.deck .pill.cover { border-style: dashed; }
.deck .pill.self { background: var(--d-ink); color: var(--d-card); }
.goal { font: 500 21px/1.3 var(--f-text); margin: 0; }
ol.routes { list-style: none; padding: 0; margin: 0; counter-reset: r; }
ol.routes li { counter-increment: r; display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--d-rule); }
ol.routes li:first-child { border-top: 0; }
ol.routes li::before { content: counter(r); font: 700 20px/1 var(--f-display); color: var(--d-mustard-text); padding-top: 2px; }
ul.plain { list-style: none; padding: 0; margin: 0; }
ul.plain li { padding: 6px 0 6px 26px; position: relative; }
ul.plain li::before { content: ''; position: absolute; left: 4px; top: 15px; width: 12px; height: 2px; background: var(--d-brick); }
ul.check li::before { width: 12px; height: 12px; top: 11px; border: 2px solid var(--d-ink); background: none; border-radius: 2px; }
ul.check li.done::before { background: var(--d-moss); border-color: var(--d-moss); }
.beware { border-left: 4px solid var(--d-mustard); background: var(--d-well); border-radius: 0 8px 8px 0; padding: 10px 14px; }
.act { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--d-rule); }
.act:first-of-type { border-top: 0; }
.act .name { font-weight: 700; font-size: 17px; }
.act .how { display: flex; gap: 6px; justify-content: flex-end; align-items: flex-start; flex-wrap: wrap; }
.act .line { grid-column: 1 / -1; color: var(--d-ink); font-size: 16px; }
.act .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.key { font-family: var(--f-label); font-size: 13px; font-weight: 500; min-width: 28px; height: 28px; padding: 0 7px; border: 1px solid var(--d-ink); border-bottom-width: 3px; border-radius: 6px; display: inline-grid; place-items: center; background: var(--d-card); }
.tapk { font-family: var(--f-label); font-size: 12px; height: 28px; padding: 0 9px; border-radius: 999px; background: var(--d-ink); color: var(--d-card); display: inline-grid; place-items: center; }
.inputs-only-key .tapk, .inputs-only-touch .key { display: none; }
.cd { position: relative; }
.src { display: none; }
.show-src .src { display: inline-flex; margin-left: 6px; vertical-align: 2px; background: var(--d-well); color: var(--d-mustard-text); }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.picker button { border: 1px solid var(--d-rule); background: var(--d-card); border-radius: 8px; padding: 8px; text-align: left; cursor: pointer; min-height: 64px; }
.picker button[aria-pressed='true'] { border: 2px solid var(--d-ink); box-shadow: inset 0 0 0 2px var(--d-mustard); }
.picker button b { display: block; font-size: 15px; }
.picker button span { font-size: 13px; color: var(--d-soft); }
.pager { display: none; }
.tabs3 { display: none; }

/* phone: one panel at a time (doc 2.3) */
@container (max-width: 760px) {
  .card { inset: 0; border-radius: 0; border-width: 0; }
  .card::before, .motif { display: none; }
  .topbar { padding: 12px 12px 10px 12px; flex-wrap: wrap; gap: 8px; }
  .topbar .title { font-size: 22px; }
  .topbar .secs { display: none; }
  .tabs3 { display: flex; width: 100%; gap: 4px; order: 5; }
  .tabs3 button { flex: 1; min-height: 40px; border: 0; border-bottom: 3px solid transparent; background: none; font-family: var(--f-label); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--d-soft); cursor: pointer; }
  .tabs3 button[aria-selected='true'] { color: var(--d-ink); border-bottom-color: var(--d-mustard); }
  .panels { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; perspective: none; scrollbar-width: none; }
  .panels::-webkit-scrollbar { display: none; }
  .panel { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 18px 16px 24px; }
  .panel + .panel { border-left: 0; box-shadow: none; }
  .card.folded .panel { transform: none; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--d-card); border-top: 2px solid var(--d-line); }
  .pager .dots { display: flex; gap: 8px; }
  .pager .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--d-ink); }
  .pager .dots i.on { background: var(--d-ink); }
  .portrait { grid-template-columns: 84px 1fr; }
  .portrait .pic { font-size: 30px; }
  .card.opening { animation: rise var(--dur-fold) var(--ease); }
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }

/* ---- the Daybook (doc 5) ---- */
.daybook { position: absolute; z-index: 12; top: 64px; right: 12px; bottom: 12px; width: min(620px, calc(100% - 24px)); display: flex; flex-direction: column;
  background: var(--d-paper); border: 2px solid var(--d-line); border-radius: 8px; box-shadow: 0 24px 60px rgb(0 0 0 / 0.45); overflow: hidden; }
.daybook.opening { animation: slide var(--dur) var(--ease); }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.db-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--d-card); border-bottom: 2px solid var(--d-line); }
.db-head h2 { margin: 0; font: 700 24px/1 var(--f-display); }
.db-tabs { display: flex; gap: 2px; padding: 0 12px; background: var(--d-card); border-bottom: 1px solid var(--d-rule); overflow-x: auto; scrollbar-width: none; }
.db-tabs button { flex: none; min-height: 44px; padding: 0 12px; border: 0; border-bottom: 3px solid transparent; background: none; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--d-soft); font-family: var(--f-label); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.db-tabs button[aria-selected='true'] { color: var(--d-ink); border-bottom-color: var(--d-mustard); }
.db-tabs .kbd { font-size: 11px; line-height: 16px; }
.db-tabs .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--d-mustard-text); }
.db-body { flex: 1; overflow: auto; padding: 16px; }
.db-foot { padding: 8px 16px; border-top: 1px solid var(--d-rule); background: var(--d-card); color: var(--d-soft); font-size: 14px; display: flex; gap: 8px; align-items: center; }
.slots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.slot { aspect-ratio: 1; border: 1px solid var(--d-rule); border-radius: 6px; background: var(--d-card); font-size: 12px; line-height: 1.15; padding: 4px; position: relative; overflow: hidden; text-align: left; cursor: pointer; }
.slot.empty { background: transparent; border-style: dashed; cursor: default; }
.slot .q { position: absolute; right: 4px; bottom: 2px; font-family: var(--f-label); font-size: 12px; }
.slot.bound::after { content: 'Bound'; position: absolute; left: 3px; bottom: 2px; font: 400 9px/1 var(--f-label); text-transform: uppercase; color: var(--d-mustard-text); }
.slot[aria-pressed='true'] { border: 2px solid var(--d-ink); box-shadow: inset 0 0 0 2px var(--d-mustard); }
.slot.held { border-color: var(--d-mustard-text); }
.inv-grid { display: grid; grid-template-columns: 1fr 200px; gap: 16px; }
.craft { display: grid; grid-template-columns: repeat(2, 56px); gap: 6px; }
.craft .slot { width: 56px; }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--d-rule); }
.row:first-child { border-top: 0; }
.big { font: 700 32px/1 var(--f-label); font-variant-numeric: tabular-nums; }

  });
}

// ---- the HUD and the touch cluster, drawn from the same action table ----
function mountHud(host) {
  const r = R(), s = S(), p = P();
  const hud = h('div', { class: 'hud' },
    h('button', { type: 'button', class: 'hud-goal', onclick: openCard, 'aria-label': `Your card. ${fillLater(p.goal)} (Tab)` }, h('span', { class: 'disc' }, svg(GLYPH.card, 18)), h('span', {}, h('b', {}, 'Your card ', h('kbd', { class: 'kbd' }, 'Tab')), h('span', {}, fillLater(p.goal)))),
    h('div', { class: 'hud-clock' }, h('div', { class: 'num' }, '06:40'), h('div', { class: 'mono' }, 'Day')),
    h('div', { class: 'hud-tr' }, h('button', { type: 'button', class: 'hud-btn', onclick: () => { ui.daybook = ui.daybook ? null : 'pockets'; ui.cardOpen = false; render(); }, 'aria-label': 'Daybook (I)' }, 'Daybook', s.fare ? h('span', { class: 'badge', 'aria-hidden': 'true' }) : '', h('kbd', {}, 'I')), h('button', { type: 'button', class: 'hud-btn', 'aria-label': 'Settings' }, '⚙')),
    h('div', { class: 'hud-body' }, h('div', { class: 'mono' }, 'Health'), h('div', { class: 'bar' }, h('i', { style: 'width:100%;background:var(--wdi-teal)' })), h('div', { class: 'mono' }, 'Stamina'), h('div', { class: 'bar' }, h('i', { style: 'width:72%;background:var(--wdi-lantern)' }))),
    h('div', { class: 'hud-purse num' }, `${s.purse} Scrip`),
    h('nav', { class: 'hotbar', 'aria-label': 'Hotbar' }, s.hotbar.map((st, i) => h('button', { type: 'button', class: i === ui.holding ? 'on' : '', onclick: () => { ui.holding = i; render(); } }, h('span', { class: 'n' }, i + 1), st ? itemName(st[0]) : ''))));
  const slots = abilityRows().filter((x) => !x.passive);
  const discs = [ACTIONS.find((a) => a.id === 'use'), ...slots.map((x) => x.action), ACTIONS.find((a) => a.id === 'strike')];
  const touch = h('div', { class: 'touch' },
    h('div', { class: 'stick' }, h('small', {}, 'Push to the rim to run')),
    h('button', { type: 'button', class: 'disc sneak-toggle', 'aria-pressed': 'false' }, h('b', {}, '⇣'), 'Sneak'),
    h('div', { class: 'cluster' }, discs.map((a) => {
      const label = a.group === 'slot' ? slots.find((x) => x.action === a).a.name : a.touch;
      return h('button', { type: 'button', class: `disc ${a.primary ? 'primary' : ''}` }, h('b', {}, a.keys[0]), label);
    })));
  hud.append(touch);
  host.append(hud);
}

// ---- render ----
function render() {
  document.documentElement.dataset.theme = ui.theme;
  const stage = document.getElementById('stage');
  stage.dataset.view = ui.view;
  stage.replaceChildren();
  const frame = h('div', { class: ui.view === 'phone' ? 'phone' : 'desk' });
  frame.append(h('div', { class: 'world', 'aria-hidden': 'true' }));
  stage.append(frame);
  mountHud(frame);
  if (ui.cardOpen) mountCard(frame);
  if (ui.daybook) mountDaybook(frame);
  if (!ui.cardOpen && !ui.daybook && ui.view === 'desktop') frame.append(h('div', { class: 'legend' }, h('b', {}, 'In play. '), 'Tab or the goal chip reopens the card. I or the Daybook button opens the Daybook; K, J, N and C open it at a tab. Esc closes.'));
  if (ui.cardOpen && ui.view === 'phone') setTimeout(() => { const ps = document.querySelector('.panels'); if (ps) ps.scrollLeft = ui.panel * ps.clientWidth; }, 0);
}

for (const [id, key] of [['m-match', 'matchMode'], ['m-role', 'role'], ['m-view', 'view'], ['m-theme', 'theme'], ['m-mode', 'mode']]) {
  document.getElementById(id).addEventListener('change', (e) => {
    ui[key] = e.target.value;
    if (key === 'matchMode' && ui.matchMode === 'paint') { ui.role = 'killer'; document.getElementById('m-role').value = 'killer'; }
    if (key === 'role' && ui.matchMode === 'paint' && ui.role !== 'killer') { ui.matchMode = 'world'; document.getElementById('m-match').value = 'world'; }
    if (key === 'role' || key === 'matchMode') { ui.picked = null; ui.holding = 0; }
    if (key === 'role' || key === 'mode' || key === 'matchMode') { ui.cardOpen = true; ui.daybook = null; ui.ready = false; ui.panel = 0; }
    render();
  });
}
document.getElementById('m-src').addEventListener('change', (e) => { ui.sources = e.target.checked; render(); });
document.getElementById('m-replay').addEventListener('click', () => { ui.mode = 'reveal'; document.getElementById('m-mode').value = 'reveal'; ui.cardOpen = true; ui.ready = false; ui.daybook = null; ui.panel = 0; render(); });
document.addEventListener('keydown', (e) => {
  if (e.target.closest('select, input')) return;
  if (e.key === 'Tab' && !e.shiftKey && !e.target.closest('.card, .daybook')) { e.preventDefault(); ui.cardOpen ? closeCard() : openCard(); return; }
  if (e.key === 'Escape') { if (ui.daybook) { ui.daybook = null; render(); } else if (ui.cardOpen && ui.mode === 'play') closeCard(); return; }
  const tab = { i: 'pockets', k: 'chores', j: 'quests', n: 'notebook', c: 'pockets' }[e.key.toLowerCase()];
  if (tab && !e.ctrlKey && !e.metaKey) { ui.daybook = ui.daybook === tab ? null : tab; ui.cardOpen = false; render(); }
  if (/^[1-6]$/.test(e.key) && !ui.cardOpen) { ui.holding = +e.key - 1; render(); }
});
if (matchMedia('(max-width: 760px)').matches) { ui.view = 'phone'; document.getElementById('m-view').value = 'phone'; }
render();
</script>
