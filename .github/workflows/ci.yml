name: CI

on:
  push:
  pull_request:
  # The `blender` job's nightly run (round 11, T1). The other jobs skip the schedule.
  schedule:
    - cron: '17 3 * * *'

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # ASSETS 6.6: warn (never fail) when a pull request adds more than 25 MB of binaries against its base.
      - name: Art drop size
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          pnpm --filter @wdi/sprites exec tsx artDrop.ts "$BASE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm lint
      - run: pnpm typecheck
      # The server suite runs in its own job below: it is the long one (npc.md part 2, section 1).
      - run: pnpm --filter '!@wdi/server' -r --if-present test
      - name: Build and dist size report
        run: |
          pnpm build
          for d in apps/*/dist apps/*/build packages/*/dist; do
            [ -d "$d" ] && du -sh "$d" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          true

  server:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wdi/server test

  # The whole Playwright suite against the real server (ARCHITECTURE 5.12, DECISIONS A514 and A554) on every pull
  # request that touches the client, the server, the shared or content packages, the lockfile or this workflow. A
  # spec went stale a round after it was written while nothing ran the suite (A494). The job is required, so on a
  # pull request that touches none of those paths, and on a push, it reports green without running.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # About 15 minutes of specs after the install, the browser and the client build.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The checkout is the merge of the pull request into its base, so the diff against the base's tip is
          # the pull request's own change. Only the two trees are needed, not the history between them.
          git fetch --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if printf '%s\n' "$changed" |
            grep -qE '^(apps/client/|apps/server/|packages/shared/|packages/content/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the suite covers changed; the job reports green without running it." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # The V2 walk-through (apps/walk, DECISIONS A610) has its own small spec against its fixture, no server.
          if printf '%s\n' "$changed" | grep -qE '^(apps/walk/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "walk=true" >> "$GITHUB_OUTPUT"
          else
            echo "walk=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.paths.outputs.run == 'true' || steps.paths.outputs.walk == 'true'
        with:
          node-version: 22
      - if: steps.paths.outputs.run == 'true' || steps.paths.outputs.walk == 'true'
        run: corepack enable
      - if: steps.paths.outputs.run == 'true' || steps.paths.outputs.walk == 'true'
        run: pnpm install --frozen-lockfile
      # The client's build resolves @wdi/content to its dist (pages.yml does the same).
      - if: steps.paths.outputs.run == 'true'
        run: pnpm --filter @wdi/content build
      # The runner has no browser; the pinned Playwright fetches its own Chromium and the libraries it needs.
      - if: steps.paths.outputs.run == 'true' || steps.paths.outputs.walk == 'true'
        run: pnpm --filter @wdi/client exec playwright install --with-deps chromium
      # Every spec but admin.spec.ts, which needs the admin login and a token (ARCHITECTURE 5.12, A554).
      - name: Playwright
        if: steps.paths.outputs.run == 'true'
        run: pnpm --filter @wdi/client test:e2e
      - name: Playwright (walk)
        if: steps.paths.outputs.walk == 'true'
        run: pnpm --filter @wdi/walk test:e2e
      - name: Traces of the failed specs
        if: failure() && (steps.paths.outputs.run == 'true' || steps.paths.outputs.walk == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            apps/client/test-results
            apps/walk/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The tests that need the `bpy` wheel (tools/blender/tests/bpy: the rig opens, a GLB imports, an isometric frame
  # has its size and alpha, two runs write the same bytes; round 11 T1) on a pull request that touches
  # tools/blender/ or this workflow, and nightly. Not required at first: it is its own job, nothing else needs it.
  blender:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(tools/blender/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under tools/blender changed; the job reports green without running." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up bpy
        if: steps.paths.outputs.run == 'true'
        run: bash tools/blender/setup.sh
      - name: bpy tests
        if: steps.paths.outputs.run == 'true'
        env:
          EGL_PLATFORM: surfaceless
        run: tools/blender/.venv/bin/python -m unittest discover -s tools/blender/tests/bpy -v
      # The figure tests (round 11, 11F F1) sit beside the pure-Python tests rather than in tests/bpy/, skip without
      # bpy, and take about 40 s. Run by file name with the same Blender python; absent until F1 merges.
      - name: bpy figure tests
        if: steps.paths.outputs.run == 'true'
        env:
          EGL_PLATFORM: surfaceless
        run: |
          if [ ! -f tools/blender/tests/test_figures_bpy.py ]; then
            echo "tools/blender/tests/test_figures_bpy.py is not in this tree yet; nothing to run." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tools/blender/.venv/bin/python -m unittest discover -s tools/blender/tests -p test_figures_bpy.py -v
