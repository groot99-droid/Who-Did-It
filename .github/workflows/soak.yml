# The long match soak (ARCHITECTURE 5.12): 6 walking bots play matches back to back for 30 minutes against the
# built server, and fail on a presence leak, a dropped bot, a protocol error, a p95 tick above 15 ms, or a run in
# which nothing happened. It never runs on push or pull request: it is started by hand (Actions > soak > Run
# workflow) and weekly. The `auto` job (round 6, docs/round6/auto-admin.md 4 and 5) plays all-NPC matches
# headless with `pnpm auto` per map and difficulty,
# on a fresh `--seed` each run, and fails on any invariant failure or a match that never reaches game over; the
# report prints the seed words of every failing match so it replays.
name: soak

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes of play
        default: '30'
  schedule:
    # Mondays 04:17 UTC.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  soak:
    name: soak
    runs-on: ubuntu-latest
    # 30 minutes of play plus install and build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wdi/server build
      - name: Soak
        shell: bash
        run: pnpm bots:soak -- --minutes ${{ inputs.minutes || '30' }} | tee soak.log
      - name: Result
        if: always()
        shell: bash
        run: |
          {
            echo "### soak"
            echo '```'
            tail -n 24 soak.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  auto:
    name: auto (${{ matrix.map }}, ${{ matrix.difficulty }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        map: [hollowmere, blackpine]
        difficulty: [easy, normal, hard]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Auto matches
        shell: bash
        run: >-
          pnpm auto -- --matches 20 --seed ${{ github.run_number }} --map ${{ matrix.map }}
          --difficulty ${{ matrix.difficulty }} --json | tee auto.log
      - name: Report
        if: always()
        shell: bash
        run: >-
          pnpm --silent --filter @wdi/auto exec tsx report/index.ts "$GITHUB_WORKSPACE/auto.log"
          "auto (${{ matrix.map }}, ${{ matrix.difficulty }})" >> "$GITHUB_STEP_SUMMARY"
