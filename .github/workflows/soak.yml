# The long match soak (ARCHITECTURE 5.12): 6 walking bots play matches back to back for 30 minutes against the
# built server, once in the main mode and once in quick mode (GDD 3.11), and fail on a presence or night leak,
# a dropped bot, a protocol error, a p95 tick above 15 ms, or a run in which nothing happened. It never runs
# on push or pull request: it is started by hand (Actions > soak > Run workflow) and weekly. The quick-mode leg
# (ONUB v2) seats 4 bots plus NPCs up to 4, 6, 8 and 10 in turn, fails on a night leak (a sleeper that received a
# `nightWake` or `nightReveal`, or any presence), and ends with the ruin rate per party size against the 20-30%
# target, from the matches it played and from the prep Monte Carlo (`pnpm bots:ruin`). The `auto` job (round 6,
# docs/round6/auto-admin.md 4) plays all-NPC matches headless with `pnpm auto`; it is `continue-on-error` until
# Session 6A lands the runner and 6B takes the guard off.
name: soak

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per mode
        default: '30'
  schedule:
    # Mondays 04:17 UTC.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  soak:
    name: soak (${{ matrix.mode }})
    runs-on: ubuntu-latest
    # 30 minutes of play plus install and build; the two modes run side by side, not one after the other.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: main
            args: ''
          - mode: onub
            args: '--bots 4 --sizes 4,6,8,10'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wdi/server build
      - name: Soak
        shell: bash
        run: pnpm bots:soak -- --mode ${{ matrix.mode }} --minutes ${{ inputs.minutes || '30' }} ${{ matrix.args }} | tee soak.log
      - name: Ruin rate (prep Monte Carlo)
        if: matrix.mode == 'onub'
        shell: bash
        run: pnpm bots:ruin | tee -a soak.log
      - name: Result
        if: always()
        shell: bash
        run: |
          {
            echo "### soak (${{ matrix.mode }})"
            echo '```'
            tail -n 24 soak.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  auto:
    name: auto (${{ matrix.map }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Round 6 pre-seed: the runner exits 2 until Session 6A fills it; 6B removes this line with the `auto` leg's report.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        map: [hollowmere, blackpine]
        mode: [main, onub]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Auto matches
        shell: bash
        run: pnpm auto -- --matches 20 --map ${{ matrix.map }} --mode ${{ matrix.mode }} --json | tee auto.log
      - name: Result
        if: always()
        shell: bash
        run: |
          {
            echo "### auto (${{ matrix.map }}, ${{ matrix.mode }})"
            echo '```'
            tail -n 24 auto.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
